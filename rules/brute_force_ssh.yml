id: brute-force-ssh
name: SSH Brute Force Attempt
description: Multiple failed SSH logins from same IP within 5 minutes
severity: high
source: syslog
category: auth
conditions:
  - field: action
    operator: eq
    value: failed_login
  - field: service
    operator: eq
    value: sshd
threshold: 5
window_seconds: 300
tags: [brute-force, ssh]
