<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kline{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/img/kline-symbol.png">
    <link rel="stylesheet" href="/static/css/app.css">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
            } catch (e) {}
        })();
    </script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    {% block head %}{% endblock %}
</head>
<body x-data="{ sidebarOpen: true }" hx-headers='{"X-Requested-With": "XMLHttpRequest"}'>

    <!-- Sidebar -->
    <aside class="sidebar" :class="{ 'collapsed': !sidebarOpen }">
        <div class="sidebar-header">
            <span class="logo" x-show="sidebarOpen">Kline</span>
            <button class="sidebar-toggle" @click="sidebarOpen = !sidebarOpen">
                <span x-text="sidebarOpen ? '&#9664;' : '&#9654;'"></span>
            </button>
        </div>
        <nav class="sidebar-nav">
            <a href="/" class="nav-item {% block nav_dashboard %}{% endblock %}">
                <span class="nav-icon">&#9632;</span>
                <span class="nav-label" x-show="sidebarOpen">Dashboard</span>
            </a>
            <a href="/events" class="nav-item {% block nav_events %}{% endblock %}">
                <span class="nav-icon">&#9776;</span>
                <span class="nav-label" x-show="sidebarOpen">Events</span>
            </a>
            <a href="/alerts" class="nav-item {% block nav_alerts %}{% endblock %}">
                <span class="nav-icon">&#9888;</span>
                <span class="nav-label" x-show="sidebarOpen">Alerts</span>
            </a>
            <a href="/search" class="nav-item {% block nav_search %}{% endblock %}">
                <span class="nav-icon">&#128269;</span>
                <span class="nav-label" x-show="sidebarOpen">Search</span>
            </a>
            <a href="/rules" class="nav-item {% block nav_rules %}{% endblock %}">
                <span class="nav-icon">&#9881;</span>
                <span class="nav-label" x-show="sidebarOpen">Rules</span>
            </a>
            <a href="/settings" class="nav-item {% block nav_settings %}{% endblock %}">
                <span class="nav-icon">&#9881;</span>
                <span class="nav-label" x-show="sidebarOpen">Settings</span>
            </a>
        </nav>
    </aside>

    <!-- Main content -->
    <div class="main" :class="{ 'sidebar-collapsed': !sidebarOpen }">
        <!-- Top bar -->
        <header class="topbar">
            <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
            <div class="topbar-right">
                <div class="health-indicators"
                     hx-get="/partials/health-badges"
                     hx-trigger="load, every 30s"
                     hx-target="#health-badges"
                     hx-swap="innerHTML">
                    <div id="health-badges">
                        <span class="badge badge-muted">ES: ...</span>
                        <span class="badge badge-muted">AI: ...</span>
                    </div>
                </div>
                <button class="icon-btn" type="button"
                        title="Toggle theme"
                        aria-label="Toggle light/dark theme"
                        onclick="toggleTheme()">
                    <span id="theme-icon" aria-hidden="true">&#9728;</span>
                </button>
                <div class="user-menu" x-data="{ open: false }">
                    <button class="user-menu-btn" type="button" @click="open = !open"
                            :aria-expanded="open">
                        <span class="user-menu-name">{{ request.session.get('username', 'account') }}</span>
                        <span class="user-menu-caret" aria-hidden="true">&#9662;</span>
                    </button>
                    <div class="user-menu-dropdown"
                         x-show="open" x-cloak
                         @click.outside="open = false"
                         x-transition.opacity>
                        <button type="button" class="user-menu-item" onclick="logout()">
                            Sign out
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Page content -->
        <main class="content">
            {% block content %}{% endblock %}
        </main>

        <footer class="app-footer">
            <img src="/static/img/kline-logo.png" alt="Kline" class="app-footer-logo">
        </footer>
    </div>

    <script src="/static/js/walkthrough.js"></script>
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
