{% extends "base.html" %}
{% block title %}Krungle - Alerts{% endblock %}
{% block nav_alerts %}active{% endblock %}
{% block page_title %}Alerts{% endblock %}

{% block content %}
<div x-data="alertsPage()">

    <!-- Status Tabs -->
    <div class="tabs mb-2">
        <button class="tab" :class="{ active: activeTab === '' }" @click="activeTab = ''; fetchAlerts()">
            All <span class="tab-count" x-text="statusCounts.new + statusCounts.acknowledged + statusCounts.resolved"></span>
        </button>
        <button class="tab" :class="{ active: activeTab === 'new' }" @click="activeTab = 'new'; fetchAlerts()">
            New <span class="tab-count badge-danger" x-show="statusCounts.new > 0" x-text="statusCounts.new"></span>
        </button>
        <button class="tab" :class="{ active: activeTab === 'acknowledged' }" @click="activeTab = 'acknowledged'; fetchAlerts()">
            Acknowledged <span class="tab-count" x-show="statusCounts.acknowledged > 0" x-text="statusCounts.acknowledged"></span>
        </button>
        <button class="tab" :class="{ active: activeTab === 'resolved' }" @click="activeTab = 'resolved'; fetchAlerts()">
            Resolved <span class="tab-count" x-show="statusCounts.resolved > 0" x-text="statusCounts.resolved"></span>
        </button>
        <button class="tab" :class="{ active: activeTab === 'suppressions' }" @click="activeTab = 'suppressions'; fetchSuppressions()">
            Suppressions
        </button>
    </div>

    <!-- Filters -->
    <div class="filters mb-2" x-show="activeTab !== 'suppressions'">
        <div class="filter-group">
            <label>Severity</label>
            <select x-model="filters.severity" @change="fetchAlerts()">
                <option value="">All</option>
                <option value="critical">Critical</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Time Range</label>
            <select x-model="filters.hours" @change="fetchAlerts()">
                <option value="24">Last 24h</option>
                <option value="72">Last 3 days</option>
                <option value="168" selected>Last 7 days</option>
                <option value="720">Last 30 days</option>
            </select>
        </div>
    </div>

    <!-- Alert Cards -->
    <template x-if="loading && activeTab !== 'suppressions'">
        <div class="empty-state"><p>Loading alerts...</p></div>
    </template>

    <template x-if="!loading && alerts.length === 0 && activeTab !== 'suppressions'">
        <div class="empty-state">
            <div class="icon">&#9888;</div>
            <p>No alerts found</p>
            <p class="text-muted mt-1">Alerts will appear here when detection rules trigger.</p>
        </div>
    </template>

    <div class="alert-list">
        <template x-for="alert in alerts" :key="alert.id">
            <div class="alert-card" :class="'alert-' + alert.severity">
                <div class="alert-card-header">
                    <div class="alert-card-left">
                        <span class="badge" :class="'badge-' + alert.severity" x-text="alert.severity"></span>
                        <span class="badge" :class="{
                            'badge-danger': alert.status === 'new',
                            'badge-warning': alert.status === 'acknowledged',
                            'badge-success': alert.status === 'resolved'
                        }" x-text="alert.status"></span>
                        <span class="alert-rule-name" x-text="alert.rule_name"></span>
                    </div>
                    <div class="alert-card-right">
                        <span class="text-muted text-mono" x-text="formatTime(alert.timestamp)"></span>
                    </div>
                </div>
                <p class="alert-description" x-text="alert.description"></p>

                <!-- Context -->
                <div class="alert-context" x-show="alert.context && Object.keys(alert.context).length > 0">
                    <template x-for="(value, key) in alert.context" :key="key">
                        <span class="context-tag">
                            <span class="context-key" x-text="key + ':'"></span>
                            <span x-text="Array.isArray(value) ? value.join(', ') : value"></span>
                        </span>
                    </template>
                </div>

                <!-- AI Explanation -->
                <template x-if="alert.ai_explanation">
                    <div class="alert-ai-explanation">
                        <span class="field-label">AI Analysis</span>
                        <p x-text="alert.ai_explanation"></p>
                    </div>
                </template>
                <template x-if="!alert.ai_explanation">
                    <button class="btn btn-sm btn-secondary"
                            @click="explainAlert(alert.id)"
                            :disabled="explaining === alert.id">
                        <template x-if="explaining === alert.id"><span class="spinner"></span></template>
                        AI Explain
                    </button>
                </template>

                <!-- Matched Events -->
                <div class="alert-events" x-show="alert.matched_events?.length > 0">
                    <span class="text-muted">Matched events:</span>
                    <span class="text-mono" x-text="alert.matched_events?.length + ' events'"></span>
                </div>

                <!-- Actions -->
                <div class="alert-actions" x-show="alert.status !== 'resolved' && resolvingAlert !== alert.id">
                    <button class="btn btn-sm btn-secondary"
                            x-show="alert.status === 'new'"
                            @click="updateStatus(alert.id, 'acknowledged')">
                        Acknowledge
                    </button>
                    <button class="btn btn-sm btn-primary"
                            @click="showResolveForm(alert)">
                        Resolve
                    </button>
                </div>

                <!-- Resolve Form (inline) -->
                <template x-if="resolvingAlert === alert.id">
                    <div class="resolve-form">
                        <div class="form-title">Resolve Alert</div>

                        <div class="form-group mb-1">
                            <label>Reason</label>
                            <input type="text" x-model="resolveReason" placeholder="Why is this expected?"
                                   style="width:100%;">
                        </div>

                        <div class="form-group mb-1">
                            <label style="display:flex;align-items:center;gap:6px;">
                                <input type="checkbox" x-model="createSuppression">
                                Create suppression rule
                            </label>
                        </div>

                        <template x-if="createSuppression">
                            <div>
                                <label class="field-label">Match on:</label>
                                <div class="field-checks">
                                    <div class="field-check disabled">
                                        <input type="checkbox" checked disabled>
                                        <span>rule: <span x-text="alert.rule_id"></span></span>
                                    </div>
                                    <template x-for="field in resolveFields" :key="field.key">
                                        <div class="field-check">
                                            <input type="checkbox" x-model="field.checked">
                                            <span x-text="field.key + ': ' + field.value"></span>
                                        </div>
                                    </template>
                                </div>

                                <div class="form-group mb-1">
                                    <label>Expires</label>
                                    <select x-model="suppressionTTL">
                                        <option value="1">1 hour</option>
                                        <option value="12">12 hours</option>
                                        <option value="24">1 day</option>
                                        <option value="168" selected>7 days</option>
                                        <option value="720">30 days</option>
                                        <option value="0">Permanent</option>
                                    </select>
                                </div>
                            </div>
                        </template>

                        <div class="form-actions">
                            <button class="btn btn-sm btn-secondary" @click="resolvingAlert = null">Cancel</button>
                            <button class="btn btn-sm btn-primary" @click="submitResolve(alert)"
                                    :disabled="!resolveReason.trim()">Resolve</button>
                        </div>
                    </div>
                </template>

                <!-- Show reason on resolved alerts -->
                <template x-if="alert.status === 'resolved' && alert.resolution_reason">
                    <div class="mt-1">
                        <span class="field-label">Reason:</span>
                        <span class="text-muted" x-text="alert.resolution_reason"></span>
                    </div>
                </template>
            </div>
        </template>
    </div>

    <!-- Suppressions List -->
    <template x-if="activeTab === 'suppressions'">
        <div>
            <template x-if="suppressions.length === 0">
                <div class="empty-state">
                    <div class="icon">&#9881;</div>
                    <p>No suppressions</p>
                    <p class="text-muted mt-1">Suppressions are created when you resolve alerts.</p>
                </div>
            </template>
            <div class="alert-list">
                <template x-for="sup in suppressions" :key="sup.id">
                    <div class="suppression-card" :class="{ 'suppression-expired': sup.status === 'expired' }">
                        <div class="suppression-card-header">
                            <div class="alert-card-left">
                                <span class="badge badge-info" x-text="sup.rule_id"></span>
                                <span class="badge" :class="sup.status === 'active' ? 'badge-success' : 'badge-muted'"
                                      x-text="sup.status"></span>
                            </div>
                            <div class="alert-card-right">
                                <button class="btn btn-sm btn-secondary"
                                        x-show="sup.status === 'expired'"
                                        @click="renewSuppression(sup)">
                                    Renew
                                </button>
                                <button class="btn btn-sm btn-secondary" style="color:var(--danger);"
                                        x-show="sup.status === 'active'"
                                        @click="deleteSuppression(sup.id)">
                                    Delete
                                </button>
                            </div>
                        </div>
                        <p class="suppression-reason" x-text="'\"' + sup.reason + '\"'"></p>
                        <div class="suppression-fields">
                            <template x-for="(val, key) in sup.match_fields" :key="key">
                                <span class="suppression-field-tag" x-text="key + ': ' + val"></span>
                            </template>
                        </div>
                        <div class="suppression-dates">
                            Created: <span x-text="formatTime(sup.created_at)"></span>
                            <template x-if="sup.expires_at">
                                <span> &middot; Expires: <span x-text="formatTime(sup.expires_at)"></span></span>
                            </template>
                            <template x-if="!sup.expires_at">
                                <span> &middot; Permanent</span>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </template>

    <!-- Pagination -->
    <div class="pagination" x-show="total > 0">
        <span class="pagination-info">
            Showing <span x-text="((page-1)*size+1)"></span>-<span x-text="Math.min(page*size, total)"></span>
            of <span x-text="total.toLocaleString()"></span> alerts
        </span>
        <div class="pagination-buttons">
            <button class="btn btn-sm btn-secondary" @click="prevPage()" :disabled="page <= 1">Prev</button>
            <button class="btn btn-sm btn-secondary" @click="nextPage()" :disabled="page * size >= total">Next</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function alertsPage() {
    return {
        alerts: [],
        total: 0,
        page: 1,
        size: 50,
        loading: true,
        activeTab: '',
        statusCounts: { new: 0, acknowledged: 0, resolved: 0 },
        explaining: null,
        filters: { severity: '', hours: '168' },
        // Resolve form state
        resolvingAlert: null,
        resolveReason: '',
        createSuppression: true,
        resolveFields: [],
        suppressionTTL: '168',
        suppressions: [],

        async fetchAlerts() {
            this.loading = true;
            const params = new URLSearchParams();
            if (this.activeTab) params.set('status', this.activeTab);
            if (this.filters.severity) params.set('severity', this.filters.severity);
            params.set('hours', this.filters.hours);
            params.set('page', this.page);
            params.set('size', this.size);

            try {
                const resp = await fetch(`/api/v1/alerts?${params}`);
                const data = await resp.json();
                this.alerts = data.alerts || [];
                this.total = data.total || 0;
                this.statusCounts = data.status_counts || { new: 0, acknowledged: 0, resolved: 0 };
            } catch (e) {
                console.error('Failed to fetch alerts:', e);
            }
            this.loading = false;
        },

        async init() {
            await this.fetchAlerts();
            setInterval(() => this.fetchAlerts(), 30000);
        },

        formatTime(ts) {
            return new Date(ts).toLocaleString();
        },

        showResolveForm(alert) {
            this.resolvingAlert = alert.id;
            this.resolveReason = '';
            this.createSuppression = true;
            this.suppressionTTL = '168';

            // Build field list from alert context
            const fields = [];
            const ctx = alert.context || {};
            if (ctx.users) {
                ctx.users.forEach(u => fields.push({ key: 'user', value: u, checked: true }));
            }
            if (ctx.source_ips) {
                ctx.source_ips.forEach(ip => fields.push({ key: 'source_ip', value: ip, checked: true }));
            }
            if (ctx.hosts) {
                ctx.hosts.forEach(h => fields.push({ key: 'host', value: h, checked: false }));
            }
            this.resolveFields = fields;
        },

        async submitResolve(alert) {
            const body = {
                new_status: 'resolved',
                reason: this.resolveReason,
                create_suppression: this.createSuppression,
            };

            if (this.createSuppression) {
                const matchFields = {};
                this.resolveFields.filter(f => f.checked).forEach(f => {
                    matchFields[f.key] = f.value;
                });
                body.suppression_fields = matchFields;
                body.suppression_ttl_hours = this.suppressionTTL === '0' ? 0 : parseInt(this.suppressionTTL);
            }

            try {
                const resp = await fetch(`/api/v1/alerts/${alert.id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                if (resp.ok) {
                    this.resolvingAlert = null;
                    await this.fetchAlerts();
                }
            } catch (e) {
                console.error('Failed to resolve alert:', e);
            }
        },

        async updateStatus(alertId, newStatus) {
            try {
                const resp = await fetch(`/api/v1/alerts/${alertId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ new_status: newStatus }),
                });
                if (resp.ok) {
                    await this.fetchAlerts();
                }
            } catch (e) {
                console.error('Failed to update alert:', e);
            }
        },

        async explainAlert(alertId) {
            this.explaining = alertId;
            try {
                const resp = await fetch(`/api/v1/ai/explain/${alertId}`, { method: 'POST' });
                if (resp.ok) {
                    await this.fetchAlerts();
                }
            } catch (e) {
                console.error('Failed to explain alert:', e);
            }
            this.explaining = null;
        },

        prevPage() {
            if (this.page > 1) { this.page--; this.fetchAlerts(); }
        },
        nextPage() {
            if (this.page * this.size < this.total) { this.page++; this.fetchAlerts(); }
        },

        async fetchSuppressions() {
            try {
                const [data, data2] = await Promise.all([
                    fetch('/api/v1/suppressions?status=active').then(r => r.json()),
                    fetch('/api/v1/suppressions?status=expired').then(r => r.json()),
                ]);
                this.suppressions = [...(data.suppressions || []), ...(data2.suppressions || [])];
            } catch (e) {
                console.error('Failed to fetch suppressions:', e);
            }
        },

        async deleteSuppression(supId) {
            try {
                const resp = await fetch(`/api/v1/suppressions/${supId}`, { method: 'DELETE' });
                if (resp.ok) await this.fetchSuppressions();
            } catch (e) {
                console.error('Failed to delete suppression:', e);
            }
        },

        async renewSuppression(sup) {
            try {
                const resp = await fetch('/api/v1/suppressions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        rule_id: sup.rule_id,
                        reason: sup.reason,
                        match_fields: sup.match_fields,
                        source_alert_id: sup.source_alert_id,
                        ttl_hours: 168,
                    }),
                });
                if (resp.ok) {
                    await fetch(`/api/v1/suppressions/${sup.id}`, { method: 'DELETE' });
                    await this.fetchSuppressions();
                }
            } catch (e) {
                console.error('Failed to renew suppression:', e);
            }
        },
    };
}
</script>
{% endblock %}
